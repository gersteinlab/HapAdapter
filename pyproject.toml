[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hapadapter"
version = "0.1.0"
description = "A transfer learning protocol for genomic foundation models adapted to diploid personal epigenomes"
authors = [
  {name = "Amy Metrick"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["genomic foundation models", "allele-specific binding", "DNABERT", "EN-TEx", "transfer learning"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
]

dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "pyfaidx",
  "pyBigWig",
  "pyyaml",
]

[project.optional-dependencies]
# model definition, training and scoring
model = [
  "torch",
  "transformers",
  "safetensors",
  "peft",
]

# figures and interpretation
analysis = [
  "matplotlib",
  "logomaker",
  "memelite",
]

alphagenome = [
  "alphagenome",
]

all = [
  "hapadapter[model]",
  "hapadapter[analysis]",
]

[project.urls]
Repository = "https://github.com/gersteinlab/HapAdapter"

[project.scripts]
hapadapter-build = "hapadapter.data.build_experiment:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"hapadapter.backbones" = [
  "weights/**/*.json",
  "weights/**/*.py",
  "weights/**/*.txt",
  "weights/**/LICENSE",
]
